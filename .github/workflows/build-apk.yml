name: Build APK

# 在 push 到本分支、或手动点击运行时，打包 debug + release APK 并作为 artifact 上传。
# release 使用与 debug 相同的签名配置（见 app/build.gradle.kts 中 signingConfigs.getByName("debug")），
# 因此可直接安装；两条产物均便于下载到手机验证「本机模拟」修复结果。
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'README.zh_CN.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle wrapper cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/**/output-metadata.json
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/**/output-metadata.json
          if-no-files-found: error

      # LSPosed 只认 APK 根目录的 META-INF/xposed/java_init.list 作为「新版模块」标记，
      # 打包遗漏会让模块在框架里直接消失，所以构建后必须校验一次。
      - name: Verify libxposed metadata inside APK
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          for f in META-INF/xposed/java_init.list META-INF/xposed/scope.list META-INF/xposed/module.prop; do
            unzip -l "$APK" | grep -q "$f" || { echo "::error::APK 缺少 $f"; exit 1; }
          done
          if unzip -l "$APK" | grep -q "assets/xposed_init"; then
            echo "::error::旧入口 assets/xposed_init 仍然存在"
            exit 1
          fi
          echo "--- java_init.list ---"; unzip -p "$APK" META-INF/xposed/java_init.list
          echo "--- scope.list ---"; unzip -p "$APK" META-INF/xposed/scope.list
          echo "--- module.prop ---"; unzip -p "$APK" META-INF/xposed/module.prop

      # 把产物发布到固定 tag 的预发布版本，方便直接 curl/浏览器下载（artifact 需要登录）。
      - name: Publish APKs to ci-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete ci-latest --yes --cleanup-tag || true
          gh release create ci-latest \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/debug/*.apk \
            --title "CI build ${GITHUB_SHA:0:7}" \
            --notes "自动构建 $(date -u +%FT%TZ) / commit ${GITHUB_SHA}" \
            --prerelease
