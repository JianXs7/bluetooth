name: Build APK

# 在 push 到本分支、或手动点击运行时，打包 debug + release APK 并作为 artifact 上传。
# release 使用与 debug 相同的签名配置（见 app/build.gradle.kts 中 signingConfigs.getByName("debug")），
# 因此可直接安装；两条产物均便于下载到手机验证「本机模拟」修复结果。
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'README.md'
      - 'README.zh_CN.md'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle wrapper cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/**/output-metadata.json
          if-no-files-found: error

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluetooth-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/**/output-metadata.json
          if-no-files-found: error
